name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - run: cargo test --all-features --locked
      # Downloads a real release (aditor's, which has the same layout) and
      # stops short of installing it. GitHub's limit for requests without a
      # login can turn it down, so it warns rather than fails.
      - run: cargo test --all-features --locked real_release -- --ignored
        continue-on-error: true

  features:
    name: each feature alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo check --locked
          for feature in update store text tui; do
            cargo check --locked --no-default-features --features "$feature"
          done

  msrv:
    name: minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --locked
